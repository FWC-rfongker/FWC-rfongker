<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>User Profile Card</h1>
    </header>
    <img class="profile-picture" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=700&q=80" alt="Profile portrait">
    <h2>rungarunfongkerd</h2>
    <p class="description">42 Bangkok Student</p>

    <table class="details">
      <tbody>
        <tr>
          <td>Campus</td>
          <td>Bangkok</td>
        </tr>
        <tr>
          <td>Learning</td>
          <td>Web development</td>
        </tr>
      </tbody>
    </table>

    <div class="social-links">
      <a href="https://github.com/" aria-label="GitHub">
        <img src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub">
      </a>
      <a href="https://www.linkedin.com/" aria-label="LinkedIn">
        <img src="https://cdn.simpleicons.org/linkedin/ffffff" alt="LinkedIn">
      </a>
      <a href="https://www.instagram.com/" aria-label="Instagram">
        <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram">
      </a>
    </div>

    <a class="contact-button" href="mailto:hello@example.com">Contact</a>
  </main>
</body>
</html>
