<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Duo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="landing-shell">
      <section class="intro text-center">
        <p class="eyebrow">RUSH 00 - PORTFOLIO DUO</p>
        <h1>Two people. Two perspectives.</h1>
        <p class="lead">Choose a profile to explore our work, skills, and ways to get in touch.</p>
      </section>

      <section class="row g-4 profile-links" aria-label="Portfolio links">
        <div class="col-md-6">
          <a class="profile-card" href="portfolio-one.html">
            <img src="images/rungarun-profile.jpg" alt="Rungarun Fongkerd">
            <span class="profile-card-content">
              <span class="card-label">Portfolio 01</span>
              <span class="card-name">Rungarun Fongkerd</span>
              <span class="card-action">View profile <span aria-hidden="true">→</span></span>
            </span>
          </a>
        </div>
        <div class="col-md-6">
          <a class="profile-card profile-card-alt" href="portfolio-two.html">
            <img src="images/profile-two.svg" alt="Illustration placeholder for Portfolio Two">
            <span class="profile-card-content">
              <span class="card-label">Portfolio 02</span>
              <span class="card-name">Your Name Two</span>
              <span class="card-action">View profile <span aria-hidden="true">→</span></span>
            </span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
