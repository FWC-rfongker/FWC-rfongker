<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td {
      border: 1px solid black;
    }

    .first-cell {
      background-color: #c7ca7d;
    }

    .second-cell {
      background-color: #f8c1ad;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td class="first-cell">First cell</td>
      <td class="second-cell">Second cell</td>
    </tr>
  </table>
</body>
</html>
